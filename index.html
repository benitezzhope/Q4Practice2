<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 Practice 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1>Switch Statement</h1>

    <button class="btn btn-info" onclick="teamRank()">Rank</button>
    <script>

        function teamRank(){
            var rank = "1st";

            var message = "";

            switch(true){
                case (rank === "1st"):
                    message = "CHAMPION!";
                    break;

                case (rank === "2nd"):
                    message = "SILVER";
                    break;

                case (rank === "3rd"):
                    message = "BRONZE";
                    break;

                case (rank === "4th"):
                    message = "1ST RUNNER UP";
                    break;
            }
            alert(message);
        }
        let team = "Green";
        
        switch(team){
        case "Green":
                alert("Go Green Hornets!!!");
                break;
        
        case "Blue":
                alert("Go Blue Bears!!!");
                break;
        
        case "Red":
                alert("Go Red Bulldogs!");
                break;

        case "Yellow":
                alert("Go Yellow Tigers!");
                break;

        default:
            alert("No Team name.");
        }

    </script>
</body>
</html>
